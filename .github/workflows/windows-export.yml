name: windows-export

# Exports the Windows build with the official templates, smoke-runs a debug export headless through the
# title, the faction pick, a level and a story scene, and uploads the release exe for a hand test.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-export-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  export:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Godot and export templates
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION
          zip=Godot_v${GODOT_VERSION}_win64.exe.zip
          tpz=Godot_v${GODOT_VERSION}_export_templates.tpz
          curl -fsSL -o "$RUNNER_TEMP/$zip" "$base/$zip"
          curl -fsSL -o "$RUNNER_TEMP/$tpz" "$base/$tpz"
          curl -fsSL -o "$RUNNER_TEMP/SHA512-SUMS.txt" "$base/SHA512-SUMS.txt"
          (cd "$RUNNER_TEMP" && grep -E " ($zip|$tpz)\$" SHA512-SUMS.txt | sha512sum -c -)
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/godot"
          dest="$APPDATA/Godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$dest"
          unzip -q -j "$RUNNER_TEMP/$tpz" 'templates/windows_*x86_64*' 'templates/version.txt' -d "$dest"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_win64_console.exe" >> "$GITHUB_ENV"

      - name: Export
        run: |
          "$GODOT" --headless --path . --import >/dev/null 2>&1 || true
          mkdir -p build/windows
          "$GODOT" --headless --path . --export-release "Windows" build/windows/TheLastLight.exe
          ls -la build/windows

      # A debug export with its console wrapper, so script errors reach stdout (a release exe is a GUI
      # program and reports little). `--smoke N` makes the game print where it is after N frames and quit,
      # so each run must show it really loaded and ran: the expected screen, level and story state.
      - name: Smoke-run a debug export
        run: |
          mkdir -p build/windows-debug
          "$GODOT" --headless --path . --export-debug "Windows" build/windows-debug/TheLastLight.exe
          exe=build/windows-debug/TheLastLight.console.exe
          test -f "$exe"
          fail=0
          check() {  # check <expected smoke line regex> <game args...>
            local want=$1; shift
            local out code=0
            out=$("$exe" --headless -- "$@" --smoke 300 --save-dir "$RUNNER_TEMP/save-$RANDOM" 2>&1) || code=$?
            if [[ $code -ne 0 ]] || ! grep -qE "$want" <<<"$out" || grep -qE "SCRIPT ERROR|Parse Error|Failed to load|^ERROR:" <<<"$out"; then
              echo "FAILED [$*] exit $code"; echo "$out"; fail=1
            else
              echo "ok [$*] $(grep '^smoke:' <<<"$out")"
            fi
          }
          check '^smoke: screen=TITLE level=0 sim_frame=0 story=idle'
          check '^smoke: screen=FACTION_PICK ' --menu factions
          check '^smoke: screen=PLAYING level=4 sim_frame=[1-9][0-9]* story=idle' --demo --level 4
          check '^smoke: screen=PLAYING level=0 .* story=active' --level 0 --scene awakening.orion 2
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: TheLastLight-windows
          path: build/windows/TheLastLight.exe
          retention-days: 14
